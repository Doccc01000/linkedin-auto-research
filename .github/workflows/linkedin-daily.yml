name: LinkedIn Daily Automation

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          APP_TIMEZONE: Europe/Paris
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-3-5-sonnet-20241022' }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_LEAD_MAGNET_DB_ID: ${{ secrets.NOTION_LEAD_MAGNET_DB_ID }}
          NOTION_RUNS_DB_ID: ${{ secrets.NOTION_RUNS_DB_ID }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_ACCOUNT_ID: ${{ secrets.BLOTATO_ACCOUNT_ID }}
          BLOTATO_BASE_URL: ${{ secrets.BLOTATO_BASE_URL || 'https://backend.blotato.com/v2' }}
        run: python src/main.py --mode daily

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-artifacts
          path: |
            artifacts/**
            reports/**
