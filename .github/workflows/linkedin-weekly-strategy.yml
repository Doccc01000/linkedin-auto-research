name: LinkedIn Weekly Strategy

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency: linkedin-weekly-strategy

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly strategy pipeline
        env:
          APP_TIMEZONE: Europe/Paris
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_ACTOR_ID_LINKEDIN_METRICS: ${{ secrets.APIFY_ACTOR_ID_LINKEDIN_METRICS }}
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL }}
        run: python src/main.py --mode weekly

      - name: Upload strategy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-strategy
          path: |
            artifacts/**
            reports/**
